name: Publish

on:
  push:
    branches:
      - beta
  workflow_dispatch:

jobs:
  publish-linux:
    # To enable auto publishing to github, update your electron publisher
    # config in package.json > "build" and remove the conditional below
    #if: ${{ github.repository_owner === 'electron-react-boilerplate' }}

    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]

    steps:
      - name: Checkout git repo
        uses: actions/checkout@v4

      - name: Git Submodule Update
        run: git submodule update --init --recursive

      - name: Use cached node_modules
        id: cache-node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Node and NPM
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        if: steps.cache-node_modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Set Beta Build
        run: |
          sed -i "s|main|beta|g" "./src/data/branch.json"
          sed -i "s|emudeck-electron|emudeck-electron-beta|g" "./package.json"
          #sed -i "s|EmuDeck|EmuDeck-beta|g" "./release/app/package.json"
          #sed -i 's|"productName": "EmuDeck"|"productName": "EmuDeck-beta"|g' "./package.json"

      - name: Install Wine
        run: |
          sudo dpkg --add-architecture i386
          sudo apt update
          sudo apt install -y wine64 wine32

      - name: Publish releases
        env:
          # These values are used for auto updates signing
          #APPLE_ID: ${{ secrets.APPLE_ID }}
          #APPLE_ID_PASS: ${{ secrets.APPLE_ID_PASS }}
          #CSC_LINK: ${{ secrets.CSC_LINK }}
          #CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # This is used for uploading release assets to github
          #npm run build:${GITHUB_REF##*/} -> Branch name
          #npm exec electron-builder -- --publish always --linux --win
          GH_TOKEN: ${{ secrets.github_token }}
        run: |
          npm run postinstall
          npm run build
          npm exec electron-builder -- --publish always --linux --x64 && npm exec electron-builder -- --publish always --win --x64

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EmuDeck-Beta-AppImage
          path: '**/*.AppImage'

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EmuDeck-beta-windows
          path: '**/*.exe'

  publish-mac:
    runs-on: macos-latest

    steps:
      - name: Checkout git repo
        uses: actions/checkout@v4

      - name: Git Submodule Update
        run: git submodule update --init --recursive

      - name: Use cached node_modules
        id: cache-node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Node and NPM
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install gnu-sed (required for Set Beta Build step on macOS)
        run: brew install gnu-sed

      - name: Install dependencies
        if: steps.cache-node_modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Set Beta Build
        run: |
          export PATH="$(brew --prefix)/opt/gnu-sed/libexec/gnubin:$PATH"
          sed -i "s|main|beta|g" "./src/data/branch.json"
          sed -i "s|emudeck-electron|emudeck-electron-beta|g" "./package.json"

      - name: Publish releases
        env:
          # Unsigned mac build — no Apple Developer cert required
          # CSC_IDENTITY_AUTO_DISCOVERY: false disables signing
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.github_token }}
        run: |
          npm run postinstall
          npm run build
          npm exec electron-builder -- --publish always --mac

      - name: Upload Mac DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EmuDeck-Beta-Mac
          path: |
            release/build/*.dmg
            release/build/*.zip
